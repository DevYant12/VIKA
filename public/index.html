<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b8f9c">
  <title>Vika · Agenda de citas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="offline" hidden role="alert">Sin conexión con el sistema. Lo que escriba no se guardará hasta que vuelva el internet.</div>
  <div id="pendientes" hidden role="status"></div>
  <header>
    <div class="marca">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg></span>
      <h1>Vika</h1>
    </div>
    <div id="sesion" hidden><span id="usuario"></span><button id="mipin" class="sec">Mi PIN</button><button id="salir" class="sec">Salir</button></div>
  </header>
  <nav hidden>
    <span class="pill"></span>
    <button data-v="agendar" class="on">Agendar</button>
    <button data-v="mis" hidden>Mis citas</button>
    <button data-v="citas">Citas del día</button>
    <button data-v="pacientes">Nuevo paciente</button>
    <button data-v="pend" hidden>Sin confirmar</button>
    <button data-v="equipo" hidden>Equipo</button>
    <button data-v="ajustes" hidden>Ajustes</button>
  </nav>
  <main id="vista"></main>
  <div id="aviso" role="status" aria-live="polite"></div>
  <script src="js/cola.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ajustes.js"></script>
</body>
</html>
